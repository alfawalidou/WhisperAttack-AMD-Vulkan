# Whisper model to use. Legacy setting for faster_whisper compatibility.
whisper_model=small.en

# Whisper backend; faster_whisper or whisper_cpp_vulkan.
whisper_backend=whisper_cpp_vulkan

# whisper.cpp Vulkan executable and model.
whisper_cpp_exe=whisper_cpp\whisper-cli.exe

#whisper_cpp_model=whisper_cpp\models\ggml-base.en.bin
whisper_cpp_model=whisper_cpp\models\ggml-small.en.bin
#whisper_cpp_model=whisper_cpp\models\ggml-medium.bin
#whisper_cpp_model=whisper_cpp\models\ggml-large-v3.bin

# Whisper device; GPU or CPU.
# Legacy setting for faster_whisper. Ignored by whisper_cpp_vulkan.
#whisper_device=CPU

# Theme used for the WhisperAttack UI.
# Values: "default" (uses the default theme set for Windows), "light" or "dark"
theme=default